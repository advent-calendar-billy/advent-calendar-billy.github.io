<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0b3d2e">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<title>HOLD'EM</title>
<style>
  :root {
    --gold: #e8b64c;
    --cream: #f5ead1;
    --ink: #3b2415;
    --felt: #0b3d2e;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; overflow: hidden; }
  body {
    background: #072619;
    font-family: 'Avenir Next', 'Segoe UI', 'Helvetica Neue', system-ui, sans-serif;
    touch-action: manipulation;
    user-select: none;
    -webkit-user-select: none;
  }
  #wrap { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
  #stage { width: 100%; height: 100%; display: block; touch-action: none; }
  #wrap.shake { animation: shake .45s linear; }
  @keyframes shake {
    0%,100% { transform: translate(0,0); }
    20% { transform: translate(-7px,4px); } 40% { transform: translate(6px,-5px); }
    60% { transform: translate(-5px,-4px); } 80% { transform: translate(4px,5px); }
  }

  /* ── wave banner ── */
  #banner {
    position: fixed; left: 0; right: 0; top: 34%;
    text-align: center;
    font-family: Georgia, serif;
    font-weight: bold;
    font-size: 46px;
    letter-spacing: 4px;
    color: var(--gold);
    text-shadow: 0 0 20px rgba(232,182,76,.6), 0 3px 0 #6b5218, 0 0 4px #000;
    pointer-events: none;
    opacity: 0;
    z-index: 8;
  }
  #banner.show { animation: bannerIn 1.8s ease-out; }
  @keyframes bannerIn {
    0% { opacity: 0; transform: scale(.6); }
    15% { opacity: 1; transform: scale(1.06); }
    25% { transform: scale(1); }
    75% { opacity: 1; }
    100% { opacity: 0; transform: scale(1.02); }
  }

  /* ── top HUD ── */
  #hud {
    position: fixed; top: env(safe-area-inset-top, 0); left: 0; right: 0;
    display: flex; align-items: center; gap: 10px;
    padding: 8px 12px;
    pointer-events: none;
    z-index: 10;
  }
  .pill {
    background: rgba(18,16,12,.85);
    border: 2px solid var(--gold);
    border-radius: 999px;
    color: var(--gold);
    font-weight: 800;
    font-size: 15px;
    padding: 5px 14px;
    display: flex; align-items: center; gap: 7px;
    pointer-events: auto;
  }
  .pill .chipdot {
    width: 16px; height: 16px; border-radius: 50%;
    background: #c9473b;
    border: 2.5px solid var(--cream);
    box-shadow: inset 0 0 0 1.5px #3b2415;
  }
  #stars { color: var(--gold); letter-spacing: 2px; font-size: 16px; }
  #stars .off { color: #574a33; }
  #waveLbl { color: var(--cream); }
  #waveLbl b { color: var(--gold); }
  .spacer { flex: 1; }
  .btn {
    background: rgba(18,16,12,.85);
    border: 2px solid var(--gold);
    border-radius: 999px;
    color: var(--cream);
    font-weight: 800;
    font-size: 15px;
    padding: 6px 14px;
    pointer-events: auto;
    cursor: pointer;
  }
  .btn:active { transform: scale(.94); }
  .btn.primary { background: var(--gold); color: #3b2415; border-color: #b98d2f; }

  /* ── start-wave button ── */
  #startWave {
    position: fixed; right: 14px; bottom: calc(14px + env(safe-area-inset-bottom, 0));
    z-index: 10;
    font-size: 17px;
    padding: 12px 22px;
    box-shadow: 0 6px 18px rgba(0,0,0,.45);
    display: none;
  }

  /* ── build sheet ── */
  #sheet {
    position: fixed; left: 0; right: 0; bottom: 0;
    background: rgba(16,13,10,.94);
    border-top: 3px solid var(--gold);
    padding: 10px 12px calc(12px + env(safe-area-inset-bottom, 0));
    display: none;
    z-index: 20;
  }
  #sheet .row { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
  .shopItem {
    background: #1d1811;
    border: 2px solid #5a4626;
    border-radius: 12px;
    color: var(--cream);
    padding: 8px 10px 7px;
    min-width: 96px;
    text-align: center;
    cursor: pointer;
  }
  .shopItem.afford { border-color: var(--gold); }
  .shopItem:not(.afford) { opacity: .45; }
  .shopItem:active { transform: scale(.95); }
  .shopItem .nm { font-weight: 800; font-size: 12.5px; }
  .shopItem .cost { color: var(--gold); font-weight: 800; font-size: 14px; margin-top: 2px; }
  .shopItem .sub { font-size: 10px; color: #b7a98a; margin-top: 2px; }
  #sheetTitle { text-align: center; color: #b7a98a; font-size: 11px; letter-spacing: 2px; text-transform: uppercase; margin-bottom: 8px; }

  /* ── modal (infobox / victory / defeat) ── */
  #modal {
    position: fixed; inset: 0;
    background: rgba(7,20,14,.72);
    display: none;
    align-items: center; justify-content: center;
    z-index: 30;
    padding: 16px;
  }
  #modalCard {
    background: linear-gradient(180deg, #16120c, #0f0d09);
    border: 3px solid var(--gold);
    border-radius: 18px;
    max-width: 420px;
    width: 100%;
    padding: 18px 20px;
    text-align: center;
    color: var(--cream);
    box-shadow: 0 0 60px rgba(232,182,76,.25);
    animation: pop .28s cubic-bezier(.34,1.56,.64,1);
  }
  @keyframes pop { from { transform: scale(.7); opacity: 0; } }
  #modalCard h2 {
    color: var(--gold);
    font-size: 22px;
    letter-spacing: 1px;
    margin-bottom: 2px;
    font-family: Georgia, serif;
  }
  #modalCard .kind { font-size: 11px; letter-spacing: 3px; text-transform: uppercase; color: #b7a98a; }
  #modalSprite { margin: 8px auto 4px; display: block; }
  #modalCard p { font-size: 14px; line-height: 1.5; color: #d8cbb0; margin: 8px 0 4px; }
  #modalCard .statline { font-size: 12.5px; color: var(--gold); font-weight: 800; margin-bottom: 12px; }
  #modalBtn { font-size: 16px; padding: 10px 26px; }

  /* ── float layer for TILT!/chips text handled in SVG ── */

  /* ── next-wave preview ── */
  #nextWave {
    position: fixed;
    right: 14px;
    bottom: calc(66px + env(safe-area-inset-bottom, 0));
    background: rgba(18,16,12,.85);
    border: 2px solid #5a4626;
    border-radius: 12px;
    padding: 5px 10px;
    display: none;
    align-items: center;
    gap: 8px;
    color: #d8cbb0;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 1px;
    z-index: 9;
  }
  #nextWave .ent { display: flex; align-items: center; gap: 2px; }
  #nextWave svg { width: 22px; height: 24px; }
  #nextWave .cnt { color: var(--gold); font-weight: 800; font-size: 12px; }

  /* ── shop bar (drag towers from here) ── */
  #shop {
    position: fixed;
    left: 10px;
    bottom: calc(8px + env(safe-area-inset-bottom, 0));
    display: flex;
    gap: 7px;
    z-index: 12;
    max-width: calc(100vw - 210px);
    overflow-x: auto;
    padding-bottom: 2px;
    scrollbar-width: none;
  }
  #shop::-webkit-scrollbar { display: none; }
  .shopCard {
    flex: 0 0 auto;
    width: 70px;
    background: rgba(18,16,12,.88);
    border: 2px solid #5a4626;
    border-radius: 12px;
    text-align: center;
    padding: 3px 2px 5px;
    color: var(--cream);
    touch-action: none;
    cursor: grab;
  }
  .shopCard.afford { border-color: var(--gold); }
  .shopCard:not(.afford) { opacity: .45; }
  .shopCard svg { width: 54px; height: 44px; display: block; margin: 0 auto; pointer-events: none; }
  .shopCard .cost { font-size: 12px; color: var(--gold); font-weight: 800; }
  .shopCard .nm { font-size: 9.5px; font-weight: 700; color: #d8cbb0; }

  /* ── portrait blocker ── */
  #rotate {
    position: fixed; inset: 0;
    background: #072619;
    z-index: 100;
    display: none;
    flex-direction: column;
    align-items: center; justify-content: center;
    gap: 14px;
    color: var(--cream);
    text-align: center;
    padding: 30px;
  }
  #rotate .ph { font-size: 54px; animation: rot 1.6s ease-in-out infinite; }
  @keyframes rot { 0%,20% { transform: rotate(0); } 60%,100% { transform: rotate(90deg); } }
  @media (orientation: portrait) { #rotate { display: flex; } }

  /* ── campaign map ── */
  #map {
    position: fixed; inset: 0;
    background:
      radial-gradient(ellipse 120% 60% at 50% -10%, #14543f 0%, transparent 60%),
      #072619;
    display: none;
    align-items: center; justify-content: center;
    z-index: 25;
  }
  #mapCard { text-align: center; padding: 20px; width: 100%; max-width: 640px; }
  .mapMarquee {
    font-family: Georgia, serif;
    font-weight: bold;
    font-size: 44px;
    letter-spacing: 3px;
    color: var(--gold);
    text-shadow: 0 0 18px rgba(232,182,76,.5), 0 3px 0 #6b5218;
  }
  .mapSub { font-size: 12px; letter-spacing: 4px; color: #9fc4b2; margin-top: 6px; text-transform: uppercase; }
  #mapComps {
    display: inline-block;
    margin: 14px 0;
    padding: 6px 18px;
    border: 2px solid var(--gold);
    border-radius: 999px;
    color: var(--gold);
    font-weight: 800;
    background: rgba(18,16,12,.8);
  }
  #mapNodes {
    display: flex; align-items: center; justify-content: center; flex-wrap: wrap;
    gap: 4px;
    margin: 10px 0 16px;
  }
  .mapNode {
    width: 48px; height: 48px;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-weight: 800; font-size: 17px;
    border: 3px solid #5a4626;
    color: #7d6c4a;
    background: #101511;
  }
  .mapNode.cleared { border-color: var(--gold); color: var(--gold); background: #241d10; }
  .mapNode.cur {
    border-color: var(--gold); color: #3b2415; background: var(--gold);
    cursor: pointer;
    animation: pulse 1.2s ease-in-out infinite;
  }
  @keyframes pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.12); } }
  .mapLink { width: 14px; height: 3px; background: #5a4626; border-radius: 2px; }
  #mapShop { margin: 6px 0 14px; }
  .mapUp {
    display: inline-block;
    margin: 4px 6px;
    padding: 8px 14px;
    border: 2px solid #5a4626;
    border-radius: 12px;
    background: #101511;
    color: var(--cream);
    min-width: 170px;
    text-align: center;
  }
  .mapUp.can { border-color: var(--gold); cursor: pointer; }
  .mapUp:not(.can) { opacity: .6; }

  /* ── slot machine ── */
  #slots {
    position: fixed; inset: 0;
    background: rgba(7,20,14,.8);
    display: none;
    align-items: center; justify-content: center;
    z-index: 26;
    padding: 16px;
  }
  #slotCard {
    background: linear-gradient(180deg, #2a1130, #16081a);
    border: 3px solid var(--gold);
    border-radius: 18px;
    max-width: 430px; width: 100%;
    padding: 18px 20px 20px;
    text-align: center;
    color: var(--cream);
    box-shadow: 0 0 60px rgba(232,182,76,.3);
    animation: pop .28s cubic-bezier(.34,1.56,.64,1);
  }
  #slotCard h2 {
    font-family: Georgia, serif;
    color: #ffd23f;
    font-size: 30px;
    letter-spacing: 3px;
    text-shadow: 0 0 14px rgba(255,210,63,.6);
    margin: 4px 0 10px;
  }
  #reels { display: flex; gap: 10px; justify-content: center; margin: 6px 0 12px; }
  .reel {
    width: 74px; height: 84px;
    background: #f5ead1;
    border: 3px solid #3b2415;
    border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    font-size: 44px;
    box-shadow: inset 0 -14px 18px rgba(0,0,0,.18), inset 0 14px 18px rgba(0,0,0,.18);
    color: #c9473b;
  }
  #slotMsg { font-size: 13.5px; color: #d8cbb0; min-height: 20px; }
  #slotInfo { margin-top: 8px; font-weight: 800; color: var(--gold); font-size: 14px; }

  /* ── ambient decor ── */
  .decScreen { animation: screenPulse 2s ease-in-out infinite; }
  @keyframes screenPulse { 0%,100% { opacity: .55; } 50% { opacity: 1; } }
  .decLeaf {
    animation: leafSway 3.4s ease-in-out infinite;
    transform-box: fill-box; transform-origin: 50% 95%;
  }
  @keyframes leafSway { 0%,100% { transform: rotate(-2.5deg); } 50% { transform: rotate(2.5deg); } }
  @keyframes ropeMarch { to { stroke-dashoffset: -16; } }
  .buffetStink { animation: stinkUp 2.2s ease-in-out infinite; }
  @keyframes stinkUp { 0%,100% { opacity: .35; transform: translateY(0); } 50% { opacity: .85; transform: translateY(-3px); } }

  /* ── enemy gaits ── */
  .gait-waddle, .gait-groove, .gait-lumber, .gait-stagger {
    transform-box: fill-box;
    transform-origin: 50% 90%;
  }
  .gait-waddle  { animation: gWaddle .55s ease-in-out infinite; }
  .gait-groove  { animation: gGroove .5s ease-in-out infinite; }
  .gait-lumber  { animation: gLumber .9s ease-in-out infinite; }
  .gait-stagger { animation: gStagger 1.2s ease-in-out infinite; }
  @keyframes gWaddle  { 0%,100% { transform: rotate(-4deg); } 50% { transform: rotate(4deg); } }
  @keyframes gGroove  { 0%,100% { transform: rotate(-7deg) translateY(0); } 50% { transform: rotate(7deg) translateY(-3px); } }
  @keyframes gLumber  { 0%,100% { transform: rotate(-2deg); } 50% { transform: rotate(2deg); } }
  @keyframes gStagger { 0%,100% { transform: rotate(-8deg) translateX(-2px); } 30% { transform: rotate(5deg); } 65% { transform: rotate(-3deg) translateX(3px); } }
</style>
</head>
<body>

<div id="wrap">
  <svg id="stage" viewBox="0 0 1120 630" preserveAspectRatio="xMidYMid meet">
    <defs>
      <pattern id="carpet" width="36" height="36" patternUnits="userSpaceOnUse">
        <rect width="36" height="36" fill="#a63029"/>
        <path d="M18 2 L34 18 L18 34 L2 18 Z" fill="#bd4136"/>
        <path d="M18 8 L28 18 L18 28 L8 18 Z" fill="none" stroke="#8f2a24" stroke-width="1.6"/>
        <circle cx="18" cy="18" r="2.6" fill="#d9a94f"/>
      </pattern>
      <radialGradient id="vignette" cx="50%" cy="46%" r="72%">
        <stop offset="55%" stop-color="#000" stop-opacity="0"/>
        <stop offset="100%" stop-color="#000" stop-opacity=".42"/>
      </radialGradient>
      <radialGradient id="lightPool" cx="50%" cy="50%" r="50%">
        <stop offset="0%" stop-color="#ffdf9e" stop-opacity=".14"/>
        <stop offset="100%" stop-color="#ffdf9e" stop-opacity="0"/>
      </radialGradient>
      <radialGradient id="steel" cx="38%" cy="34%" r="80%">
        <stop offset="0%" stop-color="#c9d0d8"/>
        <stop offset="60%" stop-color="#8d959f"/>
        <stop offset="100%" stop-color="#6a727c"/>
      </radialGradient>
      <radialGradient id="chrome" cx="40%" cy="35%" r="75%">
        <stop offset="0%" stop-color="#eef1f4"/>
        <stop offset="55%" stop-color="#aab3bc"/>
        <stop offset="100%" stop-color="#7c858f"/>
      </radialGradient>
      <linearGradient id="walkway" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="#f2e2b8"/>
        <stop offset="100%" stop-color="#e4cf9c"/>
      </linearGradient>
      <radialGradient id="vaultLeak" cx="50%" cy="50%" r="50%">
        <stop offset="0%" stop-color="#ffd23f" stop-opacity=".8"/>
        <stop offset="100%" stop-color="#ffd23f" stop-opacity="0"/>
      </radialGradient>

      <!-- ═══ ENEMY SPRITES (feet at ~y+38) ═══ -->

      <g id="sprRetiree">
        <ellipse cx="0" cy="36" rx="19" ry="5.5" fill="rgba(40,16,8,.3)"/>
        <ellipse cx="-7" cy="34" rx="5.5" ry="4" fill="#6b4a6e" stroke="#3b2415" stroke-width="2.5"/>
        <ellipse cx="7" cy="34" rx="5.5" ry="4" fill="#6b4a6e" stroke="#3b2415" stroke-width="2.5"/>
        <path d="M-15 30 Q -17 6 -11 0 L 11 0 Q 17 6 15 30 Q 0 36 -15 30 Z"
              fill="#9a8fc2" stroke="#3b2415" stroke-width="3.5"/>
        <path d="M-13 4 Q -15 -16 0 -18 Q 15 -16 13 4 Q 0 8 -13 4 Z"
              fill="#b9d3c5" stroke="#3b2415" stroke-width="3.5"/>
        <path d="M0 -18 L 0 6" stroke="#3b2415" stroke-width="1.8" opacity=".5"/>
        <path d="M12 -10 Q 20 -6 22 2" fill="none" stroke="#b9d3c5" stroke-width="6" stroke-linecap="round"/>
        <g transform="translate(23,7)">
          <path d="M-5.5 -4 L 5.5 -4 L 4.5 7 L -4.5 7 Z" fill="url(#chrome)" stroke="#3b2415" stroke-width="2.2"/>
          <circle cx="-1" cy="-6" r="2.2" fill="#e8b64c" stroke="#3b2415" stroke-width="1.3"/>
          <circle cx="2.5" cy="-5" r="2.2" fill="#e8b64c" stroke="#3b2415" stroke-width="1.3"/>
        </g>
        <path d="M-12 -10 Q -19 -5 -19 2" fill="none" stroke="#b9d3c5" stroke-width="6" stroke-linecap="round"/>
        <circle cx="0" cy="-29" r="12.5" fill="#f2b98c" stroke="#3b2415" stroke-width="3.5"/>
        <path d="M-11 -36 Q -6 -44 0 -44 Q 8 -44 11 -36 Q 4 -40 0 -40 Q -6 -40 -11 -36 Z"
              fill="#e8e4da" stroke="#3b2415" stroke-width="2.5"/>
        <circle cx="0" cy="-43" r="5.5" fill="#e8e4da" stroke="#3b2415" stroke-width="2.5"/>
        <circle cx="-4.5" cy="-29" r="1.6" fill="#3b2415"/>
        <circle cx="4.5" cy="-29" r="1.6" fill="#3b2415"/>
        <path d="M-3 -22 Q 0 -20 3 -22" fill="none" stroke="#3b2415" stroke-width="1.8" stroke-linecap="round"/>
      </g>

      <g id="sprTourist">
        <ellipse cx="0" cy="36" rx="20" ry="5.5" fill="rgba(40,16,8,.3)"/>
        <rect x="-11" y="26" width="9" height="10" rx="3.5" fill="#f2b98c" stroke="#3b2415" stroke-width="2.5"/>
        <rect x="2" y="26" width="9" height="10" rx="3.5" fill="#f2b98c" stroke="#3b2415" stroke-width="2.5"/>
        <ellipse cx="-6.5" cy="37" rx="7" ry="4" fill="#8a5a30" stroke="#3b2415" stroke-width="2.5"/>
        <ellipse cx="6.5" cy="37" rx="7" ry="4" fill="#8a5a30" stroke="#3b2415" stroke-width="2.5"/>
        <path d="M-14 8 L 14 8 L 12 28 L -12 28 Z" fill="#e4cf9c" stroke="#3b2415" stroke-width="3.5"/>
        <path d="M-15 -18 L 15 -18 L 14 10 L -14 10 Z" fill="#c9473b" stroke="#3b2415" stroke-width="3.5"/>
        <g fill="#f5ead1">
          <circle cx="-8" cy="-10" r="2.2"/><circle cx="6" cy="-13" r="2.2"/>
          <circle cx="0" cy="-3" r="2.2"/><circle cx="9" cy="-1" r="2.2"/><circle cx="-9" cy="1" r="2.2"/>
        </g>
        <path d="M-15 -18 L -22 -8 M15 -18 L 22 -8" stroke="#c9473b" stroke-width="7" stroke-linecap="round"/>
        <circle cx="-23" cy="-6" r="3.5" fill="#f2b98c" stroke="#3b2415" stroke-width="2"/>
        <circle cx="23" cy="-6" r="3.5" fill="#f2b98c" stroke="#3b2415" stroke-width="2"/>
        <rect x="-8" y="-12" width="16" height="11" rx="3" fill="#2e2622" stroke="#3b2415" stroke-width="2.5"/>
        <circle cx="0" cy="-6.5" r="3.5" fill="#79e0d2" stroke="#3b2415" stroke-width="2"/>
        <circle cx="0" cy="-30" r="12.5" fill="#f2b98c" stroke="#3b2415" stroke-width="3.5"/>
        <path d="M-16 -34 L 16 -34 L 12 -40 Q 0 -46 -12 -40 Z" fill="#e4cf9c" stroke="#3b2415" stroke-width="3"/>
        <path d="M-16 -34 L 16 -34" stroke="#c9473b" stroke-width="2.5"/>
        <circle cx="-4.5" cy="-28" r="1.6" fill="#3b2415"/>
        <circle cx="4.5" cy="-28" r="1.6" fill="#3b2415"/>
        <path d="M-3 -22 Q 0 -19 3 -22" fill="none" stroke="#3b2415" stroke-width="1.8" stroke-linecap="round"/>
      </g>

      <g id="sprElvis">
        <ellipse cx="0" cy="36" rx="21" ry="6" fill="rgba(40,16,8,.3)"/>
        <path d="M-13 -14 L 13 -14 L 17 16 L 24 34 L 8 34 L 4 20 L -4 20 L -8 34 L -24 34 L -17 16 Z"
              fill="#f5ead1" stroke="#3b2415" stroke-width="4"/>
        <path d="M-17 16 L -24 34 M17 16 L 24 34" stroke="#e8b64c" stroke-width="3"/>
        <path d="M-7 -14 L 0 0 L 7 -14" fill="#f2b98c" stroke="#3b2415" stroke-width="3"/>
        <path d="M-7 -12 Q 0 -2 7 -12" fill="none" stroke="#e8b64c" stroke-width="2"/>
        <path d="M-13 -10 Q -26 -18 -28 -32" fill="none" stroke="#f5ead1" stroke-width="7" stroke-linecap="round"/>

const NS = 'http://www.w3.org/2000/svg';
const $  = id => document.getElementById(id);
const svgEl = (name, attrs, parent) => {
  const n = document.createElementNS(NS, name);
  for (const k in attrs) n.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(n);
  return n;
};

/* ══════════ LANES (a room may fork into branches) ══════════ */
const laneEl = $('lanePath');
const STEP = 4;
let PATHS = [];
function setLanes(lanes, killOffset) {
  PATHS = lanes.map(d => {
    laneEl.setAttribute('d', d);
    const len = laneEl.getTotalLength();
    const pts = [];
    for (let dd = 0; dd <= len; dd += STEP) {
      const p = laneEl.getPointAtLength(dd);
      pts.push([p.x, p.y]);
    }
    return { d, len, killAt: len - killOffset, pts };
  });
  const g = $('laneG');
  g.innerHTML = '';
  // layer-by-layer across all branches so shadows never sit on top of walkway
  [['rgba(40,16,8,.35)', 52, {transform:'translate(3,5)'}],
   ['#7c4a22', 48, {}],
   ['#d9a94f', 43, {}],
   ['url(#walkway)', 38, {}],
   ['#c9ae76', 38, {'stroke-dasharray':'2 32', opacity:.8}],
   ['#b3934f', 7, {'stroke-dasharray':'6 16', opacity:.35, 'stroke-linecap':'round'}]
  ].forEach(([stroke, w, extra]) => {
    lanes.forEach(d => {
      svgEl('path', Object.assign({d, stroke, 'stroke-width': w, fill: 'none'}, extra), g);
    });
  });
}
const posAt = (dist, pi) => {
  const P = PATHS[pi || 0];
  return P.pts[Math.max(0, Math.min(P.pts.length - 1, Math.round(dist / STEP)))];
};
const posAtE = e => posAt(e.dist, e.pathI);

/* ══════════ PLACEMENT ══════════ */
const stageSvg = $('stage');
function clientToSvg(cx, cy) {
  const p = new DOMPoint(cx, cy).matrixTransform(stageSvg.getScreenCTM().inverse());
  return [p.x, p.y];
}
function placeOK(x, y, r, type) {
  if (x < 30 || x > 1090 || y < 58 || y > 585) return false;
  if (type !== 'rope') {                                 // the rope is a queue barrier: it BELONGS on the lane
    const clr = (24 + r) * (24 + r);                     // lane clearance for everything else
    for (const P of PATHS) {
      for (let i = 0; i < P.pts.length; i += 2) {
        const dx = P.pts[i][0] - x, dy = P.pts[i][1] - y;
        if (dx * dx + dy * dy < clr) return false;
      }
    }
  }
  for (const d of G.decor) {                             // furniture is in the way (varies every room!)
    const rr = r + d.r + 4, dx = d.x - x, dy = d.y - y;
    if (dx * dx + dy * dy < rr * rr) return false;
  }
  for (const t of G.towers) {                            // tower collision
    const rr = r + t.r + 4, dx = t.x - x, dy = t.y - y;
    if (dx * dx + dy * dy < rr * rr) return false;
  }
  const dvx = G.variant.vault[0] - x, dvy = G.variant.vault[1] - y;   // vault clearance
  if (dvx * dvx + dvy * dvy < (r + 62) * (r + 62)) return false;
  return true;
}

/* ══════════ SHOP BAR (drag to place) ══════════ */
let drag = null;
function buildShop(){
  const bar = $('shop');
  bar.innerHTML = '';
  for (const key in TTYPES) {
    const T = TTYPES[key];
    const card = document.createElement('div');
    card.className = 'shopCard';
    card.dataset.cost = effCost(T);
    card.innerHTML =
      `<svg viewBox="-62 -58 124 108"><use href="#${T.sprite}"/></svg>` +
      `<div class="cost">🪙 ${effCost(T)}</div><div class="nm">${T.name}</div>`;
    bar.appendChild(card);

    card.addEventListener('pointerdown', ev => {
      ev.stopPropagation();
      ev.preventDefault();
      if (G.chips < effCost(T) || G.over) return;
      card.setPointerCapture(ev.pointerId);
      const g = svgEl('g', { opacity: .9 }, $('ghostG'));
      const ring = T.range
        ? svgEl('circle', { r: T.range, fill: 'rgba(232,182,76,.08)', stroke: '#e8b64c', 'stroke-width': 2, 'stroke-dasharray': '6 8' }, g)
        : null;
      const foot = svgEl('circle', { r: TOWER_R[key], fill: 'rgba(87,194,110,.25)', stroke: '#57c26e', 'stroke-width': 2.5 }, g);
      const sprite = svgEl('g', { transform: `scale(${T.scale})` }, g);
      svgEl('use', { href: '#' + T.sprite }, sprite);
      drag = { key, T, g, foot, x: -999, y: -999, ok: false };
      const [x, y] = clientToSvg(ev.clientX, ev.clientY);
      moveDrag(x, y);
    });
    card.addEventListener('pointermove', ev => {
      if (!drag || drag.key !== key) return;
      const [x, y] = clientToSvg(ev.clientX, ev.clientY);
      moveDrag(x, y);
    });
    const drop = ev => {
      if (!drag || drag.key !== key) return;
      const d = drag;
      drag = null;
      d.g.remove();
      if (d.ok && G.chips >= effCost(d.T)) {
        G.chips -= effCost(d.T);
        buildTower(key, d.x, d.y);
        updateHUD();
      }
    };
    card.addEventListener('pointerup', drop);
    card.addEventListener('pointercancel', drop);
  }
  function moveDrag(x, y) {
    drag.x = x; drag.y = y;
    drag.ok = placeOK(x, y, TOWER_R[drag.key], drag.key);
    drag.g.setAttribute('transform', `translate(${x},${y})`);
    drag.foot.setAttribute('fill', drag.ok ? 'rgba(87,194,110,.25)' : 'rgba(224,90,58,.35)');
    drag.foot.setAttribute('stroke', drag.ok ? '#57c26e' : '#e05a3a');
  }
}

    b.addEventListener('pointerdown', ev => {

      G.chips -= T.up.cost;

      if (tower.type === 'rope') {

      closeSheet();
      updateHUD();
    });
    row.appendChild(b);
  }
  const s = document.createElement('div');

  s.innerHTML = `<div class="nm">SELL</div><div class="cost">🪙 +${refund}</div><div class="sub">70% back</div>`;
  s.addEventListener('pointerdown', ev => {

    if (tower.auraEl) tower.auraEl.remove();

    $('rangePrev').setAttribute('cx', x);
    $('rangePrev').setAttribute('cy', y);
    $('rangePrev').setAttribute('r', tower.range());
    $('rangePrev').setAttribute('opacity', 1);

}

/* ══════════ TOWERS ══════════ */
function buildTower(type, x, y) {
  const T = TTYPES[type];
  const tower = {
    type, x, y, r: TOWER_R[type], lvl: 1, cool: 0, stunUntil: 0,
    range() {
      if (type === 'rope') return this.lvl === 2 ? 130 : T.range;
      if (type === 'atm') return this.lvl === 2 ? 135 : T.range;
      return T.range;
    }
  };
  // the rope's slow aura is always visible, so it never looks like it does nothing
  tower.rot = 0;
  if (type === 'rope') {
    // if dropped on the lane, rotate so the posts + rope bar the corridor
    let bd = 1e9, bP = null, bi = 0;
    for (const P of PATHS) {
      for (let i = 2; i < P.pts.length - 2; i += 2) {
        const dx = P.pts[i][0] - x, dy = P.pts[i][1] - y;
        const d2 = dx * dx + dy * dy;
        if (d2 < bd) { bd = d2; bP = P; bi = i; }
      }
    }
    if (bd < 42 * 42 && bP) {
      const a = bP.pts[bi - 2], b = bP.pts[bi + 2];
      let rot = Math.atan2(b[1] - a[1], b[0] - a[0]) * 180 / Math.PI + 90;
      if (rot > 90) rot -= 180;
      if (rot < -90) rot += 180;
      tower.rot = rot;
    }
    tower.auraEl = svgEl('circle', {
      cx: x, cy: y, r: tower.range(),
      fill: 'rgba(156,35,51,.08)', stroke: '#9c2333', 'stroke-width': 2.5,
      'stroke-dasharray': '7 9', opacity: .85
    }, $('towersG'));
    tower.auraEl.style.animation = 'ropeMarch 1.1s linear infinite';
  }
  const el = svgEl('g', { transform: `translate(${x},${y}) rotate(${tower.rot}) scale(${T.scale})` }, $('towersG'));
  svgEl('use', { href: '#' + T.sprite }, el);
  tower.el = el;
  // stun overlay
  tower.stunEl = svgEl('text', {
    y: -50 / T.scale, 'text-anchor': 'middle', 'font-size': 26, 'font-weight': 'bold',
    fill: '#e05a3a', stroke: '#3b2415', 'stroke-width': 4, 'paint-order': 'stroke', opacity: 0,
    'font-family': 'Avenir Next, Segoe UI, sans-serif'
  }, el);
  tower.stunEl.textContent = 'TILT!';
  tower.auditEl = svgEl('text', {
    y: -50 / T.scale, 'text-anchor': 'middle', 'font-size': 22, 'font-weight': 'bold',
    fill: '#c9a227', stroke: '#3b2415', 'stroke-width': 4, 'paint-order': 'stroke', opacity: 0,
    'font-family': 'Avenir Next, Segoe UI, sans-serif'
  }, el);
  tower.auditEl.textContent = 'UNDER AUDIT';
  if (type === 'waitress') {
    tower.auraEl = svgEl('circle', {
      cx: x, cy: y, r: tower.range(),
      fill: 'rgba(232,182,76,.05)', stroke: '#e8b64c', 'stroke-width': 2,
      'stroke-dasharray': '3 9', opacity: .7
    }, $('towersG'));
    tower.auraEl.style.animation = 'ropeMarch 1.6s linear infinite';
    el.parentNode.insertBefore(tower.auraEl, el);
  }
  G.towers.push(tower);
  el.addEventListener('pointerdown', ev => { ev.stopPropagation(); openSheetForTower(tower); });
  return tower;
}

    pathI: Math.floor(Math.random() * PATHS.length),
    dist: 0, hp: hpMax, hpMax,
    slowT: 0, stunCd: 0, dead: false,
    luredUntil: 0, lureDps: 0, poisonUntil: 0, poisonDps: 0,
    armor: E.armor || 0, pips: []
  };
  for (let i = 0; i < enemy.armor; i++) {
    enemy.pips.push(svgEl('rect', {
      x: i * 8 - enemy.armor * 4 + 1, y: 5, width: 6, height: 7, rx: 1,
      fill: '#f5ead1', stroke: '#3b2415', 'stroke-width': 1.2
    }, barG));
  }
  tap.addEventListener('pointerdown', ev => {
    ev.stopPropagation();
    showModal(E.boss ? '⚠ BOSS ⚠' : 'GUEST DOSSIER', E.name, E.sprite, E.desc, E.stats, 'BACK TO THE FLOOR');
  });
  if (E.boss) {
    banner(E.name.toUpperCase());
    $('wrap').classList.remove('shake');
    void $('wrap').offsetWidth;
    $('wrap').classList.add('shake');
  }
  G.enemies.push(enemy);
  return enemy;
}

function spawnPair() {
  const g = spawnEnemy('groom');
  const b = spawnEnemy('bride');
  b.pathI = g.pathI;
  g.dist = 18;
  g.mate = b;
  b.mate = g;
}

function killEnemy(e, leaked) {
  e.dead = true;
  if (e.mate && !e.mate.dead) {
    e.mate.enraged = true;
    e.mate.mate = null;
    const [mx, my] = posAtE(e.mate);
    float(mx, my - 34, '💔!!', '#e05a7a');
  }
  e.el.remove();
  G.enemies = G.enemies.filter(x => x !== e);
  if (leaked) {
    G.stars = Math.max(0, G.stars - e.E.star);
    const [vx, vy] = G.variant.vault;
    float(vx - 60, vy - 40, '-' + e.E.star + ' ★', '#e05a3a');
    if (e.E.steal) {
      G.chips = Math.max(0, G.chips - e.E.steal);
      float(vx - 60, vy - 64, '-' + e.E.steal + ' chips!', '#e05a3a');
    }
    if (G.stars <= 0 && !G.over) { updateHUD(); return lose(); }
  } else {
    const [x, y] = posAtE(e);
    G.chips += e.E.reward;
    float(x, y - 26, '+' + e.E.reward, '#ffd23f');
    poof(x, y - 8);
  }
  updateHUD();
}

/* ══════════ WAVES ══════════ */
function startWave() {
  if (G.running || G.over) return;
  // queue infoboxes for unseen types in this wave
  const types = [...new Set(WAVES[G.wave].map(s => s[0]))].filter(t => !G.seen[t]);
  const launch = () => {
    G.running = true;
    $('startWave').style.display = 'none';
    $('nextWave').style.display = 'none';
    G.spawners = WAVES[G.wave].map(([type, count, interval], si) => ({
      // single-count spawners use their interval as an initial delay (boss staggering)
      type, left: count, interval, timer: count === 1 ? Math.max(interval, si * 1.6) : si * 1.6
    }));
    G.waveCount = WAVES[G.wave].reduce((a, [t, c]) => a + c * (t === 'honey' ? 2 : 1), 0);
    banner('WAVE ' + (G.wave + 1));
    updateHUD();
  };
  const chain = types.reduceRight((next, t) => () => introduce(t, next), launch);
  chain();
}
$('startWave').addEventListener('pointerdown', ev => { ev.stopPropagation(); startWave(); });

function showNextWave() {
  const nw = $('nextWave');
  if (G.wave >= WAVES.length || G.over) { nw.style.display = 'none'; return; }
  const counts = {};
  WAVES[G.wave].forEach(([type, count]) => { counts[type] = (counts[type] || 0) + count; });
  nw.innerHTML = 'NEXT:' + Object.entries(counts).map(([type, count]) =>
    `<span class="ent"><span class="cnt">${count}×</span>` +
    `<svg viewBox="-34 -68 68 84"><use href="#${ETYPES[type].sprite}"/></svg></span>`
  ).join('');
  nw.style.display = 'flex';
}

function endWave() {
  G.running = false;
  G.wave++;
  G.autoTimer = 2.5;
  let income = 25;
  G.towers.forEach(t => {
    if (t.type === 'cage') {
      const amt = t.lvl === 2 ? 100 : 45;
      income += amt;
      float(t.x, t.y - 44, '+' + amt, '#57c26e');
    }
  });
  G.chips += income;
  updateHUD();
  if (G.wave >= WAVES.length) return win();
  $('startWave').style.display = 'block';
  showNextWave();
}

function win() {
  G.over = true;
  openSlots();
}
function lose() {
  G.over = true;
  showModal('☆ ☆ ☆ ☆ ☆', 'Reputation Ruined', null,
    'Too many guests reached the vault. The review sites are merciless. The casino goes dark... but the house always gets another hand.',
    '', 'TRY AGAIN', () => location.reload());
}

/* ══════════ COMBAT ══════════ */
function damageEnemy(e, dmg) {
  if (e.E.dodge && Math.random() < e.E.dodge) {
    const [x, y] = posAtE(e);
    float(x, y - 28, 'hic!', '#b9d3c5');
    return;
  }
  if (e.E.countDodge) {
    e.hitN = (e.hitN || 0) + 1;
    if (e.hitN % e.E.countDodge === 0) {
      const [x, y] = posAtE(e);
      float(x, y - 28, 'COUNTED', '#79e0d2');
      return;
    }
  }
  if (e.armor > 0) {
    e.armor--;
    const pip = e.pips.pop();
    if (pip) pip.remove();
    return;
  }
  if (e.E.enrageOnHit && !e.enraged) {
    e.enraged = true;
    const [x, y] = posAtE(e);
    float(x, y - 32, 'MY MOJITO!!', '#e05a3a');
    svgEl('circle', { cy: -14, r: 20, fill: 'rgba(224,90,58,.3)', 'pointer-events': 'none' }, e.el);
  }
  e.hp -= dmg;
  if (e.hp <= 0) killEnemy(e, false);
  else e.hpEl.setAttribute('width', Math.max(0, (e.barW - 3) * e.hp / e.hpMax));
}

function atkSpeedFactor(t) {
  let f = 1;
  for (const w of G.towers) {
    if (w.type !== 'waitress' || w === t || w.audited) continue;
    const r = w.range(), dx = w.x - t.x, dy = w.y - t.y;
    if (dx * dx + dy * dy <= r * r) f = Math.min(f, w.lvl === 2 ? .6 : .75);
  }
  return f;
}

function firstEnemyInRange(t) {
  let best = null;
  for (const e of G.enemies) {
    const [x, y] = posAtE(e);
    const dx = x - t.x, dy = y - t.y;
    if (dx * dx + dy * dy <= t.range() * t.range()) {
      if (!best || e.dist > best.dist) best = e;
    }
  }
  return best;
}

function fireRoulette(t) {
  const target = firstEnemyInRange(t);
  if (!target) return false;
  const dmg = Math.max(1, Math.round((t.lvl === 2 ? 18 : 12) * (t.jinxed ? .3 : 1)));
  const bounces = t.lvl === 2 ? 4 : 3;
  const el = svgEl('circle', { r: 5, fill: '#fffbe8', stroke: '#3b2415', 'stroke-width': 2 }, $('projG'));
  G.projectiles.push({ kind: 'ball', x: t.x, y: t.y, el, target, dmg, bounces, hitSet: new Set() });
  return true;
}

function fireDealer(t) {
  const target = firstEnemyInRange(t);
  if (!target) return false;
  const [tx, ty] = posAtE(target);
  const base = Math.atan2(ty - t.y, tx - t.x);
  const n = t.lvl === 2 ? 5 : 3;
  const dmg = Math.max(1, Math.round((t.lvl === 2 ? 8 : 6) * (t.jinxed ? .3 : 1)));
  for (let i = 0; i < n; i++) {
    const ang = base + (i - (n - 1) / 2) * 0.21;
    const el = svgEl('g', {}, $('projG'));
    svgEl('rect', { x: -5, y: -7, width: 10, height: 14, rx: 2, fill: '#f5ead1', stroke: '#3b2415', 'stroke-width': 1.8 }, el);
    G.projectiles.push({
      kind: 'card', x: t.x, y: t.y,
      vx: Math.cos(ang) * 330, vy: Math.sin(ang) * 330,
      el, dmg, life: .55, pierce: 2, hitSet: new Set(), rot: 0
    });
  }
  return true;
}

/* ══════════ GAME LOOP ══════════ */
let last = performance.now();
function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  update(dt);
}
function update(dt) {
  if (G.paused || G.over) return;
  dt *= G.speed;
  G.time += dt;

  /* auto-start next wave */
  if (G.auto && !G.running && G.wave < WAVES.length) {
    G.autoTimer -= dt;
    if (G.autoTimer <= 0) startWave();
  }

  /* spawners */
  if (G.running) {
    for (const s of G.spawners) {
      if (s.left <= 0) continue;
      s.timer -= dt;
      if (s.timer <= 0) {
        if (s.type === 'honey') spawnPair();
        else spawnEnemy(s.type);
        s.left--;
        s.timer = s.interval;
      }
    }
    if (G.spawners.every(s => s.left <= 0) && G.enemies.length === 0) endWave();
  }

  /* enemies */
  for (const e of [...G.enemies]) {
    const [ex, ey] = posAtE(e);
    /* pinned at the shrimp buffet */
    if (e.luredUntil > G.time) {
      e.hp -= e.lureDps * dt;
      e.poisonUntil = G.time + 4;
      e.poisonDps = e.lureDps * .5;
      if (e.hp <= 0) { killEnemy(e, false); continue; }
      e.hpEl.setAttribute('width', Math.max(0, (e.barW - 3) * e.hp / e.hpMax));
      continue;
    }
    /* food poisoning lingers */
    if (e.poisonUntil > G.time) {
      e.hp -= e.poisonDps * dt;
      if (e.hp <= 0) { killEnemy(e, false); continue; }
      e.hpEl.setAttribute('width', Math.max(0, (e.barW - 3) * e.hp / e.hpMax));
      e.sickT = (e.sickT || 0) + dt;
      if (e.sickT > 1.4) { e.sickT = 0; float(ex, ey - 30, '🤢', '#9aa86a'); }
    }
    let slow = 1;
    for (const t of G.towers) {
      if (t.type !== 'rope' || t.audited) continue;
      const dx = ex - t.x, dy = ey - t.y;
      if (dx * dx + dy * dy <= t.range() * t.range()) {
        slow = Math.min(slow, t.lvl === 2 ? .45 : .6);
      }
    }
    /* influencer haste aura + mojito rage */
    let boost = e.enraged ? e.E.enrage : 1;
    if (e.E.aura !== 'haste') {
      for (const inf of G.enemies) {
        if (inf.E.aura !== 'haste') continue;
        const [ix, iy] = posAtE(inf);
        const dx = ix - ex, dy = iy - ey;
        if (dx * dx + dy * dy < 90 * 90) { boost *= 1.3; break; }
      }
    }
    const slowed = slow < 1;
    e.slowEl.setAttribute('opacity', slowed ? 1 : 0);
    e.gaitG.style.animationDuration = slowed ? '1.1s' : '';
    e.dist += e.E.speed * slow * boost * dt;
    if (e.dist >= PATHS[e.pathI].killAt) { killEnemy(e, true); continue; }  // despawn AT the vault door
    const [x, y] = posAtE(e);
    e.el.setAttribute('transform', `translate(${x},${y - 4})`);
    /* honeymooners heal while both live */
    if (e.E.pairHeal && e.mate && !e.mate.dead && e.hp < e.hpMax) {
      e.hp = Math.min(e.hpMax, e.hp + e.E.pairHeal * dt);
      e.hpEl.setAttribute('width', Math.max(0, (e.barW - 3) * e.hp / e.hpMax));
      e.healT = (e.healT || 0) + dt;
      if (e.healT > 2.2) {
        e.healT = 0;
        float(x, y - 30, '+♥', '#57c26e');
      }
    }
    /* the Regular's staff doors */
    if (e.E.skip) {
      e.skipT = (e.skipT || 0) + dt;
      if (e.skipT >= e.E.skip.every) {
        e.skipT = 0;
        if (e.dist < PATHS[e.pathI].killAt - 220) {
          fxDoor(posAtE(e));
          e.dist += e.E.skip.dist;
          const [nx, ny] = posAtE(e);
          fxDoor([nx, ny]);
          float(nx, ny - 34, 'STAFF ONLY', '#d9a94f');
        }
      }
    }
    /* grandma tower-tap */
    if (e.E.special === 'stun') {
      e.stunCd -= dt;
      if (e.stunCd <= 0) {
        let near = null, nd = 1e9;
        for (const t of G.towers) {
          if (t.type === 'cage' || t.type === 'rope') continue;  // she only taps machines
          const dx = x - t.x, dy = y - t.y, d2 = dx * dx + dy * dy;
          if (d2 < 110 * 110 && d2 < nd && G.time > t.stunUntil) { near = t; nd = d2; }
        }
        if (near) {
          near.stunUntil = G.time + 2.5;
          e.stunCd = 6;
        } else e.stunCd = 1;
      }
    }
  }

  /* Lady Luck's jinx: towers in her aura roll minimum damage */
  const jinxers = G.enemies.filter(e => e.E.jinx);
  for (const t of G.towers) {
    t.jinxed = false;
    for (const j of jinxers) {
      const [jx, jy] = posAtE(j);
      const dx = jx - t.x, dy = jy - t.y;
      if (dx * dx + dy * dy <= j.E.jinx * j.E.jinx) { t.jinxed = true; break; }
    }
  }

  /* the Auditor freezes the priciest tower while he lives */
  let auditTarget = null;
  if (G.enemies.some(e => e.E.audit)) {
    let best = -1;
    for (const t of G.towers) {
      const c = TTYPES[t.type].cost + (t.lvl === 2 ? TTYPES[t.type].up.cost : 0);
      if (c > best) { best = c; auditTarget = t; }
    }
  }

  /* towers */
  for (const t of G.towers) {
    t.audited = t === auditTarget;
    t.auditEl.setAttribute('opacity', t.audited ? 1 : 0);
    t.stunEl.setAttribute('opacity', !t.audited && G.time < t.stunUntil ? 1 : 0);
    if (t.audited) continue;
    if (t.type === 'cage' || t.type === 'rope' || t.type === 'waitress') continue;
    if (G.time < t.stunUntil) continue;
    t.cool -= dt;
    if (t.cool > 0) continue;
    if (t.type === 'buffet') {
      if (t.lureWave !== G.wave) { t.lureWave = G.wave; t.lures = Math.max(1, Math.floor((G.waveCount || 10) * (t.lvl === 2 ? .2 : .05))); }
      if (t.lures > 0) {
        let nb = null, nd = t.range() * t.range();
        for (const e of G.enemies) {
          if (e.E.boss || e.luredUntil > G.time) continue;
          const [x, y] = posAtE(e);
          const dx = x - t.x, dy = y - t.y, d2 = dx * dx + dy * dy;
          if (d2 < nd) { nd = d2; nb = e; }
        }
        if (nb) {
          t.lures--;
          nb.luredUntil = G.time + 2.6;
          nb.lureDps = t.lvl === 2 ? 15 : 9;
          float(t.x, t.y - 34, 'FREE SHRIMP!', '#e07b39');
        }
      }
      t.cool = 3;
      continue;
    }
    if (t.type === 'atm') {
      let n = 0;
      const rr = t.range() * t.range();
      for (const e of G.enemies) {
        const [x, y] = posAtE(e);
        const dx = x - t.x, dy = y - t.y;
        if (dx * dx + dy * dy <= rr) n++;
      }
      if (n) {
        const amt = n * (t.lvl === 2 ? 2 : 1);
        G.chips += amt;
        float(t.x, t.y - 32, '+' + amt, '#57c26e');
        updateHUD();
      }
      t.cool = 1;
    } else if (t.type === 'craps') {
      let hitAny = false;
      const rr = t.range() * t.range();
      const push = t.lvl === 2 ? 85 : 60;
      for (const e of G.enemies) {
        const [x, y] = posAtE(e);
        const dx = x - t.x, dy = y - t.y;
        if (dx * dx + dy * dy <= rr) { e.dist = Math.max(0, e.dist - push); hitAny = true; }
      }
      if (hitAny) {
        float(t.x, t.y - 36, 'SEVEN!', '#ffd23f');
        t.cool = t.lvl === 2 ? 4.5 : TTYPES.craps.cd;
      } else t.cool = .3;
    } else if (t.type === 'catapult') {
      const ammo = t.lvl === 2 ? 12 : 8;
      const target = G.chips >= ammo ? firstEnemyInRange(t) : null;
      if (target) {
        G.chips -= ammo;
        updateHUD();
        const [tx, ty] = posAtE(target);
        const el = svgEl('g', {}, $('projG'));
        svgEl('circle', { r: 7, fill: '#c9473b', stroke: '#3b2415', 'stroke-width': 2 }, el);
        svgEl('circle', { r: 3, fill: '#f5ead1' }, el);
        G.projectiles.push({
          kind: 'lob', x: t.x, y: t.y, sx: t.x, sy: t.y, tx, ty, el,
          t: 0, dur: .55,
          dmg: Math.max(1, Math.round((t.lvl === 2 ? 70 : 40) * (t.jinxed ? .3 : 1))),
          aoe: t.lvl === 2 ? 80 : 60
        });
        t.cool = TTYPES.catapult.cd * atkSpeedFactor(t);
      } else t.cool = .3;
    } else {
      const fired = t.type === 'roulette' ? fireRoulette(t) : fireDealer(t);
      t.cool = fired ? TTYPES[t.type].cd * atkSpeedFactor(t) : 0.1;
    }
  }

  /* projectiles */
  for (const p of [...G.projectiles]) {
    if (p.kind === 'ball') {
      if (!p.target || p.target.dead) {
        // retarget nearest
        let nb = null, nd = 1e9;
        for (const e of G.enemies) {
          if (p.hitSet.has(e)) continue;
          const [x, y] = posAtE(e);
          const d2 = (x - p.x) ** 2 + (y - p.y) ** 2;
          if (d2 < nd) { nd = d2; nb = e; }
        }
        p.target = nb;
        if (!p.target) { p.el.remove(); G.projectiles = G.projectiles.filter(q => q !== p); continue; }
      }
      const [tx, ty] = posAtE(p.target);
      const dx = tx - p.x, dy = ty - p.y;
      const d = Math.hypot(dx, dy);
      const sp = 360 * dt;
      if (d <= sp + 8) {
        // hit
        p.hitSet.add(p.target);
        damageEnemy(p.target, p.dmg);
        p.bounces--;
        p.x = tx; p.y = ty;
        if (p.bounces <= 0) { p.el.remove(); G.projectiles = G.projectiles.filter(q => q !== p); continue; }
        // bounce to a new target within 140
        let nb = null, nd = 140 * 140;
        for (const e of G.enemies) {
          if (p.hitSet.has(e)) continue;
          const [x, y] = posAtE(e);
          const d2 = (x - p.x) ** 2 + (y - p.y) ** 2;
          if (d2 < nd) { nd = d2; nb = e; }
        }
        if (!nb) { p.el.remove(); G.projectiles = G.projectiles.filter(q => q !== p); continue; }
        p.target = nb;
      } else {
        p.x += dx / d * sp;
        p.y += dy / d * sp;
      }
      p.el.setAttribute('cx', p.x);
      p.el.setAttribute('cy', p.y);
    } else if (p.kind === 'lob') {
      p.t += dt;
      const k = Math.min(1, p.t / p.dur);
      const x = p.sx + (p.tx - p.sx) * k;
      const y = p.sy + (p.ty - p.sy) * k - Math.sin(k * Math.PI) * 70;
      const sc = 1 + Math.sin(k * Math.PI) * .7;
      p.el.setAttribute('transform', `translate(${x},${y}) scale(${sc})`);
      if (k >= 1) {
        poof(p.tx, p.ty);
        poof(p.tx + 10, p.ty - 6);
        for (const e of [...G.enemies]) {
          const [ex2, ey2] = posAtE(e);
          if ((ex2 - p.tx) ** 2 + (ey2 - p.ty) ** 2 <= p.aoe * p.aoe) damageEnemy(e, p.dmg);
        }
        p.el.remove();
        G.projectiles = G.projectiles.filter(q => q !== p);
      }
    } else {
      // card
      p.life -= dt;
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.rot += 720 * dt;
      p.el.setAttribute('transform', `translate(${p.x},${p.y}) rotate(${p.rot})`);
      if (p.life <= 0) { p.el.remove(); G.projectiles = G.projectiles.filter(q => q !== p); continue; }
      for (const e of G.enemies) {
        if (p.hitSet.has(e)) continue;
        const [x, y] = posAtE(e);
        if ((x - p.x) ** 2 + (y - p.y) ** 2 < 18 * 18) {
          p.hitSet.add(e);
          damageEnemy(e, p.dmg);
          p.pierce--;
          if (p.pierce <= 0) { p.el.remove(); G.projectiles = G.projectiles.filter(q => q !== p); break; }
        }
      }
    }
  }

  /* ambient staff */
  for (const w of G.ambient) {
    const dx = w.tx - w.x, dy = w.ty - w.y;
    const d = Math.hypot(dx, dy);
    if (d < 6) { pickAmbientTarget(w); continue; }
    w.x += dx / d * 26 * dt;
    w.y += dy / d * 26 * dt;
    w.el.setAttribute('transform', `translate(${w.x},${w.y}) scale(.62,.52)`);
  }

  /* fx */
  for (const f of [...G.fx]) {
    f.t += dt;
    f.el.setAttribute('opacity', Math.max(0, .95 * (1 - f.t / f.life)));
    if (f.t > f.life) { f.el.remove(); G.fx = G.fx.filter(q => q !== f); }
  }

  /* particles */
  for (const p of [...G.parts]) {
    p.t += dt;
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.vy += 160 * dt;
    p.el.setAttribute('cx', p.x);
    p.el.setAttribute('cy', p.y);
    p.el.setAttribute('opacity', Math.max(0, 1 - p.t / .6));
    if (p.t > .6) { p.el.remove(); G.parts = G.parts.filter(q => q !== p); }
  }

  /* floats */
  for (const f of [...G.floats]) {
    f.t += dt;
    f.el.setAttribute('y', f.y - f.t * 34);
    f.el.setAttribute('opacity', Math.max(0, 1 - f.t / 1.1));
    if (f.t > 1.1) { f.el.remove(); G.floats = G.floats.filter(q => q !== f); }
  }
}
requestAnimationFrame(frame);

/* ══════════ CONTROLS ══════════ */
$('speedBtn').addEventListener('pointerdown', ev => {
  ev.stopPropagation();
  G.speed = G.speed === 1 ? 2 : G.speed === 2 ? 4 : 1;
  $('speedBtn').textContent = '×' + G.speed;
});
$('autoBtn').addEventListener('pointerdown', ev => {
  ev.stopPropagation();
  G.auto = !G.auto;
  $('autoBtn').classList.toggle('primary', G.auto);
});
$('pauseBtn').addEventListener('pointerdown', ev => {
  ev.stopPropagation();
  if ($('modal').style.display === 'flex') return;
  G.paused = !G.paused;
  $('pauseBtn').textContent = G.paused ? '▶' : '⏸';
});

/* ══════════ ROOMS / MAP ══════════ */
function makeEndless() {
  const waves = [];
  const pool = ['retiree','tourist','drunk','mojito','elvis','clipper','grandma','influencer','counter','regular'];
  for (let w = 0; w < 50; w++) {
    const wave = [];
    const streams = 2 + Math.min(3, Math.floor(w / 6));
    for (let k = 0; k < streams; k++) {
      const t = pool[Math.floor(Math.random() * pool.length)];
      wave.push([t, 6 + Math.floor(w * 1.2), Math.max(.25, 1.4 - w * .03)]);
    }
    if (w % 5 === 4) wave.push([w % 15 === 14 ? 'lady' : w % 10 === 9 ? 'shark' : 'whale', 1 + Math.floor(w / 12), 15]);
    if (w > 6 && Math.random() < .4) wave.push(['honey', 2 + Math.floor(w / 8), 5]);
    waves.push(wave);
  }
  return { name: 'The Endless Pit', hpMul: 2.6, chips: 500,
    intro: 'No closing time tonight. Fifty generated waves, each meaner than the last. How deep can the house hold?',
    variants: ROOMS.flatMap(r => r.variants),
    waves };
}

function initRoom(i) {
  ROOM = i;
  const R = i >= ROOMS.length ? makeEndless() : ROOMS[i];
  G.roomDef = R;
  const V = R.variants[Math.floor(Math.random() * R.variants.length)];
  G.variant = V;
  setLanes(V.lanes, V.killOffset);
  WAVES = R.waves;
  G.chips = R.chips + 60 * (SAVE.upg.bank || 0);
  buildShop();
  $('vaultG').setAttribute('transform', `translate(${V.vault[0]},${V.vault[1]}) scale(.6)`);
  $('entryG').setAttribute('transform', `translate(0,${V.entryY - 130})`);
  placeDecor();
  $('map').style.display = 'none';
  updateHUD();
  $('startWave').style.display = 'block';
  showNextWave();
  $('waveTot').textContent = WAVES.length;
  showModal(i >= ROOMS.length ? '∞ · AFTER HOURS' : `ROOM ${i + 1} OF 50 · SLOTS PIT`,
    R.name, null, R.intro, 'TAP ANY GUEST FOR THEIR DOSSIER', 'OPEN THE DOORS');
}

function renderMap() {
  $('mapComps').textContent = `🎟 ${SAVE.comps} COMPS`;
  const holder = $('mapNodes');
  holder.innerHTML = '';
  for (let i = 0; i < 10; i++) {
    const real = i < ROOMS.length;
    const unlocked = real && i < SAVE.unlocked;
    const cleared = i < SAVE.unlocked - 1;
    const b = document.createElement('div');
    b.className = 'mapNode' + (cleared ? ' cleared' : unlocked ? ' cur' : '');
    b.textContent = real ? (cleared ? '★' : i + 1) : '?';
    if (unlocked && !cleared) b.addEventListener('pointerdown', () => initRoom(i));
    else if (cleared) b.addEventListener('pointerdown', () => initRoom(i));  // replay
    holder.appendChild(b);
    if (i < 9) {
      const c = document.createElement('div');
      c.className = 'mapLink';
      holder.appendChild(c);
    }
  }
  // comps shop: permanent upgrades (provisional design)
  const UPG = [
    { k: 'bank',  name: 'Bigger Bankroll', desc: '+60 starting chips per level', max: 3, cost: l => 25 + l * 15 },
    { k: 'cheap', name: 'House Discount',  desc: 'towers 5% cheaper per level',  max: 2, cost: l => 40 + l * 20 }
  ];
  const shop = $('mapShop');
  shop.innerHTML = '<div class="mapSub" style="margin-bottom:4px">SPEND COMPS</div>';
  UPG.forEach(u => {
    const l = SAVE.upg[u.k] || 0;
    const maxed = l >= u.max;
    const c = u.cost(l);
    const div = document.createElement('div');
    div.className = 'mapUp' + (!maxed && SAVE.comps >= c ? ' can' : '');
    div.innerHTML =
      `<div style="font-weight:800">${u.name} <span style="color:var(--gold)">${'★'.repeat(l)}</span></div>` +
      `<div style="font-size:11px;color:#b7a98a">${u.desc}</div>` +
      `<div style="font-size:12.5px;color:var(--gold);font-weight:800">${maxed ? 'MAXED' : '🎟 ' + c}</div>`;
    if (!maxed) div.addEventListener('pointerdown', () => {
      if (SAVE.comps < c) return;
      SAVE.comps -= c;
      SAVE.upg[u.k] = l + 1;
      saveSave();
      renderMap();
    });
    shop.appendChild(div);
  });

  // the Endless Pit opens once the (current) campaign is cleared
  const e = document.createElement('div');
  const endlessOpen = SAVE.unlocked > ROOMS.length;
  e.className = 'mapNode' + (endlessOpen ? ' cur' : '');
  e.textContent = '∞';
  e.style.marginLeft = '10px';
  if (endlessOpen) e.addEventListener('pointerdown', () => initRoom(ROOMS.length));
  holder.appendChild(e);
}

/* ══════════ AMBIENT DECOR (randomized per room — furniture blocks tower spots) ══════════ */
function decorSpotOK(x, y, r) {
  if (x < 70 || x > 1050 || y < 95 || y > 555) return false;
  const clr = (30 + r) * (30 + r);
  for (const P of PATHS) {
    for (let i = 0; i < P.pts.length; i += 2) {
      const dx = P.pts[i][0] - x, dy = P.pts[i][1] - y;
      if (dx * dx + dy * dy < clr) return false;
    }
  }
  for (const d of G.decor) {
    const rr = r + d.r + 14, dx = d.x - x, dy = d.y - y;
    if (dx * dx + dy * dy < rr * rr) return false;
  }
  const dvx = G.variant.vault[0] - x, dvy = G.variant.vault[1] - y;
  if (dvx * dvx + dvy * dvy < (r + 95) * (r + 95)) return false;
  return true;
}
function placeDecor() {
  const g = $('decorG');
  g.innerHTML = '';
  G.decor = [];
  G.ambient = [];
  const KINDS = [
    { id: 'decSlot', r: 32, min: 2, max: 4 },
    { id: 'decBJ',   r: 48, min: 1, max: 2 },
    { id: 'decPlant', r: 24, min: 1, max: 2 }
  ];
  for (const k of KINDS) {
    const n = k.min + Math.floor(Math.random() * (k.max - k.min + 1));
    for (let i = 0; i < n; i++) {
      for (let tries = 0; tries < 50; tries++) {
        const x = 80 + Math.random() * 960, y = 100 + Math.random() * 450;
        if (!decorSpotOK(x, y, k.r)) continue;
        const rot = (Math.random() * 14 - 7).toFixed(1);
        const el = svgEl('g', { transform: `translate(${x.toFixed(0)},${y.toFixed(0)}) rotate(${rot})` }, g);
        svgEl('use', { href: '#' + k.id }, el);
        G.decor.push({ x, y, r: k.r });
        break;
      }
    }
  }
  // a waitress (or two) works the floor — pure atmosphere
  const nW = 1 + Math.floor(Math.random() * 2);
  for (let i = 0; i < nW; i++) {
    const el = svgEl('g', {}, g);
    const inner = svgEl('g', { class: 'gait-waddle' }, el);
    svgEl('use', { href: '#sprWaitress' }, inner);
    const w = { el, x: 150 + Math.random() * 800, y: 150 + Math.random() * 350, tx: 0, ty: 0 };
    pickAmbientTarget(w);
    G.ambient.push(w);
  }
}
function pickAmbientTarget(w) {
  if (G.decor.length && Math.random() < .7) {
    const d = G.decor[Math.floor(Math.random() * G.decor.length)];
    w.tx = d.x + (Math.random() * 90 - 45);
    w.ty = d.y + (Math.random() * 90 - 45);
  } else {
    w.tx = 120 + Math.random() * 880;
    w.ty = 120 + Math.random() * 400;
  }
}

/* ══════════ SLOT MACHINE (between floors) ══════════ *//* ══════════ SLOT MACHINE (between floors) ══════════ */
const SLOT = { spins: 10, free: 0, bonusWon: 0, spinning: false, COST: 25, CAP: 400 };
const STRIP = ['🍒','🍒','🍒','🍒','🍋','🍋','🍋','🍋','♦','♦','♦','7','7','★'];
const pickSym = () => STRIP[Math.floor(Math.random() * STRIP.length)];

function slotInfo(msg) {
  updateHUD();
  $('slotInfo').textContent =
    `CHIPS ${Math.floor(G.chips)} · ` +
    (SLOT.free > 0 ? `FREE GAMES ${SLOT.free}` : `SPINS LEFT ${SLOT.spins}`);
  if (msg) $('slotMsg').textContent = msg;
  const can = !SLOT.spinning && (SLOT.free > 0 || (SLOT.spins > 0 && G.chips >= SLOT.COST));
  $('spinBtn').style.opacity = can ? 1 : .4;
  $('spinBtn').textContent = SLOT.free > 0 ? 'SPIN · FREE' : 'SPIN · ' + SLOT.COST;
}
function openSlots() {
  $('slots').style.display = 'flex';
  slotInfo(`${G.roomDef.name} cleared! Every 10 chips banks 1 comp.`);
}
$('spinBtn').addEventListener('pointerdown', ev => {
  ev.stopPropagation();
  if (SLOT.spinning) return;
  const free = SLOT.free > 0;
  if (!free && (SLOT.spins <= 0 || G.chips < SLOT.COST)) return;
  const wasFree = free;
  if (free) SLOT.free--; else { SLOT.spins--; G.chips -= SLOT.COST; }
  SLOT.spinning = true;
  const reels = document.querySelectorAll('#reels .reel');
  const final = [pickSym(), pickSym(), pickSym()];
  let t = 0;
  const iv = setInterval(() => {
    t += 80;
    reels.forEach((r, i) => {
      r.textContent = t < 380 + i * 260 ? pickSym() : final[i];
    });
    if (t >= 380 + 2 * 260 + 90) {
      clearInterval(iv);
      SLOT.spinning = false;
      const [a, b, c] = final;
      let win = 0, msg = 'So close.';
      if (a === '★' && b === '★' && c === '★') {
        SLOT.free += 10;
        msg = '✨ 10 FREE GAMES! ✨';
      } else if (a === b && b === c) {
        win = { '7': 500, '♦': 300, '🍒': 200, '🍋': 150 }[a];
        msg = `THREE OF A KIND! +${win}`;
      } else if (a === b || b === c || a === c) { win = 25; msg = 'Pair! +25'; }
      else if (final.includes('🍒')) { win = 10; msg = 'Cherry! +10'; }
      if (win && wasFree) {  // free-game winnings are hard-capped: no infinite bonus
        if (SLOT.bonusWon + win > SLOT.CAP) {
          win = Math.max(0, SLOT.CAP - SLOT.bonusWon);
          SLOT.free = 0;
          msg = `House limit! +${win} — bonus over.`;
        }
        SLOT.bonusWon += win;
      }
      G.chips += win;
      slotInfo(msg);
    }
  }, 80);
  slotInfo('...');
});
$('cashBtn').addEventListener('pointerdown', ev => {
  ev.stopPropagation();
  if (SLOT.spinning) return;
  const comps = Math.floor(G.chips / 10);
  SAVE.comps += comps;
  SAVE.unlocked = Math.max(SAVE.unlocked, Math.min(ROOM + 2, ROOMS.length + 1));
  saveSave();
  location.reload();
});

/* ══════════ BOOT ══════════ */
updateHUD();
renderMap();
$('map').style.display = 'flex';
const roomParam = location.search.match(/room=(\d+)/);
if (roomParam) initRoom(Math.min(ROOMS.length - 1, Math.max(0, +roomParam[1] - 1)));

/* offline support */
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}

/* iOS: no pinch zoom, no double-tap zoom */
document.addEventListener('gesturestart', e => e.preventDefault());
document.addEventListener('dblclick', e => e.preventDefault());

/* dev gallery: ?gallery renders every sprite large for visual review */
if (location.search.includes('gallery')) {
  const ids = ['sprRetiree','sprTourist','sprElvis','sprGrandma','sprClipper','sprInfluencer',
               'sprDrunk','sprMojito','sprCounter','sprGroom','sprBride','sprRegular','sprWaitress','sprAuditor','sprLady','sprWhale','sprShark',
               'twDealer','twRoulette','twRope','twCage','twATM','twCraps','twBuffet','twWaitress','twCatapult','decSlot','decBJ','decPlant'];
  document.querySelectorAll('#hud,#startWave,#shop,#nextWave,#modal,#map,#slots').forEach(n => n.style.display = 'none');
  G.paused = true; G.over = true;
  const gal = svgEl('g', {}, stageSvg);
  svgEl('rect', { width: 1120, height: 630, fill: '#0b3d2e' }, gal);
  ids.forEach((id, i) => {
    const x = 90 + (i % 8) * 138, y = 140 + Math.floor(i / 8) * 260;
    svgEl('circle', { cx: x, cy: y, r: 62, fill: 'rgba(0,0,0,.25)' }, gal);
    const h = svgEl('g', { transform: `translate(${x},${y}) scale(1.15)` }, gal);
    svgEl('use', { href: '#' + id }, h);
    svgEl('text', { x, y: y + 92, 'text-anchor': 'middle', 'font-size': 15, fill: '#e8b64c',
                    'font-weight': 'bold', 'font-family': 'Georgia' }, gal).textContent = id.replace(/^(spr|tw)/, '');
  });
}

/* dev slottest: jump straight to the slot machine and spin a few times */
if (location.search.includes('slottest')) {
  $('modal').style.display = 'none';
  $('map').style.display = 'none';
  G.chips = 300;
  G.paused = true;
  openSlots();
  let n = 0;
  const t = setInterval(() => {
    if (SLOT.spinning) return;
    if (n++ < 3) $('spinBtn').dispatchEvent(new Event('pointerdown'));
    else clearInterval(t);
  }, 300);
}

/* dev autotest: ?autotest plays the campaign unattended */
if (location.search.includes('autotest')) {
  if ($('map').style.display !== 'none') {
    const cur = document.querySelector('.mapNode.cur');
    if (cur) cur.dispatchEvent(new Event('pointerdown'));
  }
  $('modalBtn').dispatchEvent(new Event('click'));
  buildTower('dealer', 430, 212);
  buildTower('roulette', 560, 385);
  buildTower('dealer', 240, 385);
  buildTower('roulette', 240, 212);
  buildTower('craps', 700, 385);
  buildTower('rope', 340, 300);
  G.towers.forEach(t => { t.lvl = 2; });
  updateHUD();
  const auto = setInterval(() => {
    if ($('slots').style.display === 'flex') {
      if (!SLOT.spinning) $('cashBtn').dispatchEvent(new Event('pointerdown'));
      return;
    }
    if ($('modal').style.display === 'flex') $('modalBtn').dispatchEvent(new Event('click'));
    else if (!G.running && !G.over) startWave();
  }, 400);
  // drive the simulation off timers too (headless rAF doesn't advance under virtual time)
  setInterval(() => update(0.032), 32);
}
</script>
